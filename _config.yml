remote_theme: pages-themes/dinky@v0.2.0
title: Cloud Cloud Dot Dev
description: Written account of my readings, learnings, and thoughts.
url: https://williammilisic.github.io
baseurl: /cloudcloud.dev
lang: en
author: William Milisic
markdown: kramdown
exclude:
- scratch.md
- .sass-cache/
- .jekyll-cache/
- Gemfile
- Gemfile.lock
- node_modules/
- vendor/
# Visitor stats. Set this to your GoatCounter site code, so that a code of
# "williammilisic" sends counts to williammilisic.goatcounter.com. Leaving it
# unset simply means no tracking script is loaded at all.
goatcounter: williammilisic
plugins:
- jekyll-remote-theme 
- jekyll-feed
- jekyll-seo-tag
