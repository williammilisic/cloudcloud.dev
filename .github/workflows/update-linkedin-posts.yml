name: Update LinkedIn Posts & Booklist
on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

# This job commits to main, so never let two runs overlap.
concurrency:
  group: update-linkedin-posts
  cancel-in-progress: false

jobs:
  update-linkedin-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs rather than floating tags, so a
      # retagged or compromised release cannot reach the RapidAPI key.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Fetch LinkedIn posts
        env:
          RAPIDAPI_LINKEDIN_DATA_API_KEY: ${{ secrets.RAPIDAPI_LINKEDIN_DATA_API_KEY }}
        run: |
          # Generate URL-encoded date string for last week's UTC date at 00:00
          encodedDate=$(date -u -d '7 days ago' +'%Y-%m-%d 00:00' | sed 's/ /%20/g;s/:/%3A/g')
          echo "Fetching posts from date: $encodedDate"
          # --fail stops an HTTP error body being saved as though it were data,
          # and the two limits keep a hung or oversized response from stalling
          # the runner or filling its disk. Redirects stay off so the key is
          # never replayed to a host other than the one it belongs to.
          curl --request GET \
           --proto '=https' \
           --fail \
           --silent \
           --show-error \
           --max-time 120 \
           --max-filesize 50000000 \
           --url 'https://linkedin-scraper-api-real-time-fast-affordable.p.rapidapi.com/profile/posts?username=williammilisic' \
           --header 'x-rapidapi-host: linkedin-scraper-api-real-time-fast-affordable.p.rapidapi.com' \
           --header "x-rapidapi-key: $RAPIDAPI_LINKEDIN_DATA_API_KEY" \
           -o linkedin-posts.json

      # The merge is field-level and additive: a truncated preview from the
      # scraper must never replace the archived full text or engagement stats,
      # and a rejected payload aborts the run before anything is committed.
      - name: Merge new posts with existing JSON
        run: |
          python scripts/merge_linkedin_posts.py linkedin-posts.json _data/linkedin-posts.json

      - name: Remove temporary posts file
        run: rm -f linkedin-posts.json

      - name: Sync new book reviews to booklist.md
        run: |
          python scripts/update_booklist.py

      # The books figures are derived from booklist.md, so they are rebuilt in
      # the same commit that changes it and cannot drift out of step with it.
      - name: Rebuild the books figures
        run: |
          python scripts/build_book_stats.py

      - name: Commit and push changes if any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/linkedin-posts.json booklist.md _data/books.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update LinkedIn posts and booklist.md $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
